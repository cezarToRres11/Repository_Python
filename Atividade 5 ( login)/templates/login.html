<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Controle de Acesso</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-bottom: 20px; text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; }
        button { width: 100%; padding: 10px; background-color:rgb(216, 31, 87); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: rgb(216, 31, 87); }
        .erro { color: red; font-size: 14px; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>
        
        <!-- Exibe mensagem de erro se a validação falhar -->
        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="input_usuario" placeholder="Nome de Usuário" required>
            <input type="password" name="input_senha" placeholder="Senha / Matrícula" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
