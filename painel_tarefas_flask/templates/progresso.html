{% extends "base.html" %}

{% block title %}Progresso — TaskFlow{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div>
        <h1 class="fw-bold mb-1">Dashboard de progresso</h1>
        <p class="text-secondary mb-0">
            Visualize a quantidade de tarefas em cada status.
        </p>
    </div>

    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
        Voltar às tarefas
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <div class="chart-container">
            <canvas id="graficoTarefas"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script>
async function carregarGrafico() {
    const resposta = await fetch("/api/progresso");
    const dados = await resposta.json();

    new Chart(document.getElementById("graficoTarefas"), {
        type: "bar",
        data: {
            labels: ["Pendente", "Em andamento", "Concluída"],
            datasets: [{
                label: "Quantidade de tarefas",
                data: [
                    dados["Pendente"],
                    dados["Em andamento"],
                    dados["Concluída"]
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });
}

carregarGrafico();
</script>
{% endblock %}
