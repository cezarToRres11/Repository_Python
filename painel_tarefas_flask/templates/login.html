{% extends "base.html" %}

{% block title %}Login — TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-check2-circle display-5 text-primary"></i>
                    <h1 class="h3 mt-2">Entrar</h1>
                    <p class="text-secondary">Acesse seu painel de tarefas.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="seu@email.com"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input
                            type="password"
                            name="senha"
                            class="form-control"
                            required
                        >
                    </div>

                    <button class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Entrar
                    </button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-secondary">Ainda não possui conta?</span>
                    <a href="{{ url_for('cadastro') }}">Criar conta</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
