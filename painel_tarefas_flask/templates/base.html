<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Painel de Tarefas{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') if current_user else url_for('login') }}">
            <i class="bi bi-check2-square"></i> TaskFlow
        </a>

        {% if current_user %}
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">
                        <i class="bi bi-house"></i> Tarefas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('progresso') }}">
                        <i class="bi bi-bar-chart"></i> Progresso
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <button id="darkModeBtn" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-moon-stars"></i>
                    <span>Modo escuro</span>
                </button>

                <span class="small text-secondary">
                    Olá, {{ current_user["nome"] }}
                </span>

                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </a>
            </div>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container py-4">
    {% if erro %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i>
            {{ erro }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</main>

<footer class="container pb-4 text-center text-secondary small">
    Painel de Controle de Tarefas — Flask + SQLite
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

{% block scripts %}{% endblock %}
</body>
</html>
