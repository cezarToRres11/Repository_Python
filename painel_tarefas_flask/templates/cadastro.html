{% extends "base.html" %}

{% block title %}Cadastro — TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus display-5 text-primary"></i>
                    <h1 class="h3 mt-2">Criar conta</h1>
                    <p class="text-secondary">Cadastre-se para começar.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input
                            type="text"
                            name="nome"
                            class="form-control"
                            maxlength="100"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input
                            type="password"
                            name="senha"
                            class="form-control"
                            minlength="6"
                            required
                        >
                        <div class="form-text">
                            Mínimo de 6 caracteres.
                        </div>
                    </div>

                    <button class="btn btn-primary w-100">
                        <i class="bi bi-person-check"></i>
                        Cadastrar
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}">
                        Já tenho uma conta
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
